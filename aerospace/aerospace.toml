# AeroSpace Configuration
# Streamlined 6-Workspace Cosmere Setup

config-version = 2
after-startup-command = ['exec-and-forget ~/.config/borders/bordersrc']
start-at-login = true
auto-reload-config = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Allow macOS "Hide application" (cmd-h) feature so macOS App Nap can sleep background apps
automatically-unhide-macos-hidden-apps = false

# Persistent Workspaces (1: Term, 2: Code, 3: Web, 4: Chat/AI, 5: Media/Docs, 6: Spotify)
persistent-workspaces = [
    "1",
    "2",
    "3",
    "4",
    "5",
    "6",
]

# Notify Sketchybar about workspace changes
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE; sketchybar --trigger app_switcher_update; sketchybar --trigger space_windows_change',
]

# Notify Sketchybar about window focus changes
on-focus-changed = [
    'move-mouse monitor-lazy-center',
    'exec-and-forget sketchybar --trigger window_focus',
    'exec-and-forget sketchybar --trigger app_switcher_update',
]

focus-follows-mouse.enabled = true
key-mapping.preset = 'qwerty'

# Gaps
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 12
gaps.outer.top = 50
gaps.outer.right = 8

# Space 6 automatically lives on secondary monitor if attached
[workspace-to-monitor-force-assignment]
6 = 'secondary'

# ── Main Mode Keybindings ──
[mode.main.binding]

# Launch Terminal (Ghostty)
alt-enter = 'exec-and-forget open -a Ghostty'

# Layout & Orientation Switching
alt-slash = [
    'layout tiles horizontal vertical',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]
alt-comma = [
    'layout accordion horizontal vertical',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]
alt-period = [
    'layout tiles accordion',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]

ctrl-alt-b = [
    'layout horizontal',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]
ctrl-alt-v = [
    'layout vertical',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]

# Directional Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move Windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resizing
alt-minus = 'resize smart -10'
alt-equal = 'resize smart +10'

# Window Warping (Join with nearest node)
ctrl-alt-h = 'join-with left'
ctrl-alt-j = 'join-with down'
ctrl-alt-k = 'join-with up'
ctrl-alt-l = 'join-with right'

# Navigation across Workspaces & Displays
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
ctrl-alt-p = 'move-node-to-workspace prev'
ctrl-alt-n = 'move-node-to-workspace next'
ctrl-alt-s = ['move-node-to-monitor left', 'focus-monitor left']
ctrl-alt-g = ['move-node-to-monitor right', 'focus-monitor right']

# Fullscreen & Float & Balance
ctrl-alt-f = 'fullscreen'
ctrl-alt-t = 'layout floating tiling'
ctrl-alt-e = 'balance-sizes'

# Workspace Switching (1..6)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'

# Move Node to Workspace (1..6)
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'

# Service Mode (Cosmere Gold Accent Flash)
alt-shift-semicolon = [
    'mode service',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$HONOR_GOLD"',
]

# ── Service Mode Keybindings ──
[mode.service.binding]
esc = [
    'reload-config',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
r = [
    'flatten-workspace-tree',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
f = [
    'layout floating tiling',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
backspace = [
    'close-all-windows-but-current',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
alt-shift-h = [
    'join-with left',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
alt-shift-j = [
    'join-with down',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
alt-shift-k = [
    'join-with up',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
alt-shift-l = [
    'join-with right',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]

# ── App Routing Rules ──

# Space 1: Terminal & CLI
[[on-window-detected]]
if.app-name-regex-substring = 'iTerm2|iTerm|Terminal|Alacritty|kitty|Ghostty'
run = 'move-node-to-workspace 1'

# Space 2: Code & Development
[[on-window-detected]]
if.app-name-regex-substring = 'Code|VS Code|Cursor|Antigravity IDE|Claude|Xcode|Codeforces|LeetCode|takeUforward|Overleaf'
run = 'move-node-to-workspace 2'

# Space 3: Web & Research
[[on-window-detected]]
if.app-name-regex-substring = 'Brave Browser|Google Chrome|Safari|Firefox|Colab|Calendar|Helium'
run = 'move-node-to-workspace 3'

# Space 4: Communication, Chat & AI
[[on-window-detected]]
if.app-name-regex-substring = 'ChatGPT|Gemini|Slack|Discord|WhatsApp|Gmail|Messages|Instagram|LinkedIn|Reddit|Pinterest|Meet|Perplexity'
run = 'move-node-to-workspace 4'

# Space 5: Media, Docs & Study
[[on-window-detected]]
if.app-name-regex-substring = 'Music|VLC|mpv|YouTube|Prime Video|Twitch|Netflix|Classroom|Nalanda|StudyDeck|NotebookLM|Preview'
run = 'move-node-to-workspace 5'

# Space 6: Spotify (Isolated)
[[on-window-detected]]
if.app-name-regex-substring = 'Spotify'
run = 'move-node-to-workspace 6'

# Floating Utilities
[[on-window-detected]]
if.app-name-regex-substring = 'System Settings|Karabiner-Elements|QuickTime Player|Calculator|Finder|Activity Monitor|1Password|Bitwarden|App Store|Dictionary|Tot'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = '⌨️ Shortcut Hub|Picture-in-Picture|PIP'
run = 'layout floating'

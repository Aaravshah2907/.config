# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = ['exec-and-forget ~/.config/borders/bordersrc']

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Allow macOS "Hide application" (cmd-h) feature so macOS App Nap can sleep background apps
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
# Active: T(erm) C(ode) B(rowser) M(sg) S(potify) V(ideo) E(du) A(I) P(review)
persistent-workspaces = [
    "T",
    "C",
    "B",
    "M",
    "S",
    "V",
    "E",
    "A",
    "P",
]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Notify Sketchybar about workspace changes
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE; sketchybar --trigger app_switcher_update; sketchybar --trigger space_windows_change',
]

# Notify Sketchybar about window focus changes (single consolidated event)
on-focus-changed = [
    'move-mouse monitor-lazy-center',
    'exec-and-forget sketchybar --trigger window_focus',
    'exec-and-forget sketchybar --trigger app_switcher_update',
]

focus-follows-mouse.enabled = true
key-mapping.preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# See: https://nikitabobko.github.io/AeroSpace/guide#gaps
gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     12
gaps.outer.top =        50
gaps.outer.right =      8

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# Launch Terminal (Ghostty)
alt-enter = 'exec-and-forget open -na Ghostty'

# Floating Scratchpad Terminal
alt-backtick = 'exec-and-forget open -na Ghostty --args --title="Quick Terminal"'

# Layout & Orientation Switching
alt-slash = [
    'layout tiles horizontal vertical',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]
alt-comma = [
    'layout accordion horizontal vertical',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]
alt-period = [
    'layout tiles accordion',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]

# Explicit orientation splits (horizontal / vertical split for next window)
ctrl-alt-b = [
    'layout horizontal',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]
ctrl-alt-v = [
    'layout vertical',
    'exec-and-forget sketchybar --trigger aerospace_layout_change',
]

# Directional Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move Windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Quick Resizing
alt-minus = 'resize smart -10'
alt-equal = 'resize smart +10'

# Window Warping (Join with nearest node)
ctrl-alt-h = 'join-with left'
ctrl-alt-j = 'join-with down'
ctrl-alt-k = 'join-with up'
ctrl-alt-l = 'join-with right'

# Navigation across Workspaces & Displays
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
ctrl-alt-p = 'move-node-to-workspace prev'
ctrl-alt-n = 'move-node-to-workspace next'
ctrl-alt-s = ['move-node-to-monitor left', 'focus-monitor left']
ctrl-alt-g = ['move-node-to-monitor right', 'focus-monitor right']

# Fullscreen & Float & Balance
ctrl-alt-f = 'fullscreen'
ctrl-alt-t = 'layout floating tiling'
ctrl-alt-e = 'balance-sizes'

# Workspace Switching (Only listed spaces: T, C, B, M, S, V, E, A, P)
alt-t = 'workspace T'
alt-c = 'workspace C'
alt-b = 'workspace B'
alt-m = 'workspace M'
alt-s = 'workspace S'
alt-v = 'workspace V'
alt-e = 'workspace E'
alt-a = 'workspace A'
alt-p = 'workspace P'

# Move Node to Workspace
alt-shift-t = 'move-node-to-workspace T'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-v = 'move-node-to-workspace V'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-p = 'move-node-to-workspace P'

# Enter Resize Mode
alt-r = [
    'mode resize',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$RADIANT_PURPLE"',
]

# Service Mode (Cosmere Gold Accent Flash)
alt-shift-semicolon = [
    'mode service',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$HONOR_GOLD"',
]

# ── Resize Mode Keybindings ──
[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
minus = 'resize smart -50'
equal = 'resize smart +50'
e = [
    'balance-sizes',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
esc = [
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
enter = [
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = [
    'reload-config',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
r = [
    'flatten-workspace-tree',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
f = [
    'layout floating tiling',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
backspace = [
    'close-all-windows-but-current',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]

alt-shift-h = [
    'join-with left',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
alt-shift-j = [
    'join-with down',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
alt-shift-k = [
    'join-with up',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]
alt-shift-l = [
    'join-with right',
    'mode main',
    'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\$BAR_COLOR"',
]

# Auto-spiral: alternate split direction for subsequent windows
[[on-window-detected]]
run = ['split opposite']
check-further-callbacks = true

# Space T: Terminal & CLI
[[on-window-detected]]
if.app-name-regex-substring = 'iTerm2|iTerm|Terminal|Alacritty|kitty|Ghostty'
if.window-title-regex-substring = '^(?!.*(Quick Terminal|Scratchpad)).*$'
run = 'move-node-to-workspace T'

# Floating Scratchpad
[[on-window-detected]]
if.window-title-regex-substring = 'Quick Terminal|Scratchpad'
run = ['layout floating']

# Space C: Code & Development
[[on-window-detected]]
if.app-name-regex-substring = 'Code|VS Code|Cursor|Antigravity IDE|Claude|Xcode|Codeforces|LeetCode|takeUforward|Overleaf'
run = 'move-node-to-workspace C'

# Space B: Web & Research
[[on-window-detected]]
if.app-name-regex-substring = 'Helium|Brave Browser|Google Chrome|Safari|Firefox|Colab|Calendar'
run = 'move-node-to-workspace B'

# Space M: Communication, Chat & AI
[[on-window-detected]]
if.app-name-regex-substring = 'ChatGPT|Gemini|Slack|Discord|WhatsApp|Gmail|Messages|Instagram|LinkedIn|Reddit|Pinterest|Meet'
run = 'move-node-to-workspace M'

# Space S: Spotify (Floating)
[[on-window-detected]]
if.app-name-regex-substring = 'Spotify'
run = ['move-node-to-workspace S', 'layout floating']

# Space V: Media & Streaming
[[on-window-detected]]
if.app-name-regex-substring = 'Music|VLC|mpv|YouTube|Prime Video|Twitch|Netflix'
run = 'move-node-to-workspace V'

# Space E: Study & Academics
[[on-window-detected]]
if.app-name-regex-substring = 'Classroom|Nalanda|StudyDeck|NotebookLM'
run = 'move-node-to-workspace E'

# Space A: AI Research
[[on-window-detected]]
if.app-name-regex-substring = 'Perplexity'
run = 'move-node-to-workspace A'

# Space P: Preview & Documents
[[on-window-detected]]
if.app-name-regex-substring = 'Preview'
run = 'move-node-to-workspace P'

# Floating Utilities
[[on-window-detected]]
if.app-name-regex-substring = 'System Settings|Karabiner-Elements|QuickTime Player|Calculator|Finder|Activity Monitor|1Password|Bitwarden|App Store|Dictionary|Tot'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = '⌨️ Shortcut Hub|Picture-in-Picture|PIP'
run = 'layout floating'


#:schema https://dinky.rodeo/schemas/dinky.json

start-at-login = true
workspaces = 6
default-layout = 'tiles'
follow-app-activation = true
float-windows-without-fullscreen = true

[accordion]
padding = 30

[animations]
enabled = true
duration-ms = 150

[drag]
placeholders = true

[gaps]
inner = 8
outer = { top = 56, bottom = 12, left = 8, right = 8 }

[display.main]
gaps.outer = { top = 56, bottom = 12, left = 8, right = 8 }

# Space 6 automatically lives on secondary monitor if attached
[workspace-to-display]
6 = 'secondary'

[borders]
enabled = true
width = 3
active-color = '#00A8E8'
inactive-color = '#1A2A3Acc'
exclude-apps = [
  'com.apple.controlcenter',
  'pl.maketheweb.cleanshotx',
]

[focus-follows-mouse]
enabled = true
delay-ms = 50
accordion-edges = true

[hooks]
workspace-changed = [
  'exec-and-forget sketchybar --trigger dinky_workspace_change FOCUSED_WORKSPACE=$DINKY_WORKSPACE PREV_WORKSPACE=$DINKY_PREV_WORKSPACE',
  'exec-and-forget sketchybar --trigger app_switcher_update',
  'exec-and-forget sketchybar --trigger space_windows_change',
]
focus-changed = [
  'exec-and-forget sketchybar --trigger window_focus',
  'exec-and-forget sketchybar --trigger app_switcher_update',
  'exec-and-forget sketchybar --trigger space_windows_change',
]
mode-changed = [
  'exec-and-forget sketchybar --trigger dinky_mode_changed MODE=$DINKY_MODE',
]

# ── App Routing Rules ──
[[rules]]
app-name = 'Ghostty|iTerm|Terminal|Alacritty|kitty'
run = 'move-window-to-workspace 1'

[[rules]]
app-name = 'Code|VS Code|Cursor|Antigravity IDE|Claude|Xcode|Overleaf|LeetCode'
run = 'move-window-to-workspace 2'

[[rules]]
app-name = 'Brave Browser|Google Chrome|Safari|Firefox|Colab|Calendar|Helium'
run = 'move-window-to-workspace 3'

[[rules]]
app-name = 'ChatGPT|Gemini|Slack|Discord|WhatsApp|Messages|Gmail|LinkedIn|Meet|Perplexity'
run = 'move-window-to-workspace 4'

[[rules]]
app-name = 'Preview|NotebookLM|Classroom|Nalanda|StudyDeck|Music|VLC|mpv|YouTube|Netflix'
run = 'move-window-to-workspace 5'

[[rules]]
app-name = 'Spotify'
run = 'move-window-to-workspace 6'

[[rules]]
app-name = 'System Settings|Karabiner-Elements|Calculator|Finder|Activity Monitor|1Password|Bitwarden|App Store|Dictionary'
run = 'layout floating'

[[rules]]
title = '⌨️ Shortcut Hub|Picture-in-Picture|PIP'
run = 'layout floating'

# ── Keybindings: Main Mode ──
[mode.main]
alt-enter = 'exec-and-forget open -a Ghostty'

# Workspace Switching
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'

# Move Window to Workspace
alt-shift-1 = 'move-window-to-workspace 1'
alt-shift-2 = 'move-window-to-workspace 2'
alt-shift-3 = 'move-window-to-workspace 3'
alt-shift-4 = 'move-window-to-workspace 4'
alt-shift-5 = 'move-window-to-workspace 5'
alt-shift-6 = 'move-window-to-workspace 6'

# Directional Focus (Multi-monitor traversal)
alt-h = 'focus left --boundaries all-monitors-outer-frame'
alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
alt-k = 'focus up --boundaries-action wrap-around-the-workspace'
alt-l = 'focus right --boundaries all-monitors-outer-frame'

# Window Moving
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Window Warping (Join with adjacent tile)
ctrl-alt-h = 'join-with left'
ctrl-alt-j = 'join-with down'
ctrl-alt-k = 'join-with up'
ctrl-alt-l = 'join-with right'

# Display & Workspace Navigation
alt-tab = 'workspace-back-and-forth'
ctrl-alt-p = 'move-window-to-workspace prev'
ctrl-alt-n = 'move-window-to-workspace next'
ctrl-alt-s = 'move-window-to-display prev'
ctrl-alt-g = 'move-window-to-display next'

# Layouts & Sizing
alt-slash = [
  'layout tiles',
  'exec-and-forget sketchybar --trigger dinky_layout_change',
]
alt-comma = [
  'layout accordion',
  'exec-and-forget sketchybar --trigger dinky_layout_change',
]
alt-period = [
  'layout tiles accordion',
  'exec-and-forget sketchybar --trigger dinky_layout_change',
]
ctrl-alt-f = 'fullscreen'
ctrl-alt-t = 'layout floating tiles'
ctrl-alt-e = 'balance-sizes'
alt-minus = 'resize smart -10'
alt-equal = 'resize smart +10'

# Service Mode
alt-shift-semicolon = [
  'mode service',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$HONOR_GOLD"',
]

# ── Keybindings: Service Mode ──
[mode.service]
esc = [
  'reload-config',
  'mode main',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$BAR_COLOR"',
]
r = [
  'flatten-workspace-tree',
  'mode main',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$BAR_COLOR"',
]
f = [
  'layout floating tiles',
  'mode main',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$BAR_COLOR"',
]
alt-shift-h = [
  'join-with left',
  'mode main',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$BAR_COLOR"',
]
alt-shift-j = [
  'join-with down',
  'mode main',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$BAR_COLOR"',
]
alt-shift-k = [
  'join-with up',
  'mode main',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$BAR_COLOR"',
]
alt-shift-l = [
  'join-with right',
  'mode main',
  'exec-and-forget /bin/bash -c "source ~/.local/bin/cosmere_colors.sh && sketchybar --animate tanh 15 --bar color=\\$BAR_COLOR"',
]

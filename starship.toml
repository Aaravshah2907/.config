# =============================================================================
# ~/.config/starship.toml
# Aarav's Starship config — Cosmere / Stormlight Archive Theme
# Hybrid Connected Capsule (P10k Powerline Style + Tree Line)
#
# Color key (hex values from Cosmere palette):
#   Windrunner Sapphire  →  #00BFFF  (SAPPHIRE)
#   Honor Gold           →  #FFD700  (HONOR_GOLD)
#   Lifebound Emerald    →  #50fa7b  (EMERALD)
#   Shardblade Violet    →  #8989ff  (VIOLET)
#   Lightweaver Amber    →  #ffb86c  (AMBER)
#   Odium Crimson        →  #ed8796  (CRIMSON)
#   Honorspren Blue      →  #00A8E8  (SPREN_HONOR)
#   Glacial Teal         →  #5DA8CC  (PRES_GLACIAL)
#   Willshaper Amethyst  →  #E040FB  (SPREN_WILL)
#   Stormfather Slate    →  #607D8B  (SPREN_STORM)
#   Panel Dark Slate     →  #1A2A3A  (PANEL_BG)
#   Deep Night BG        →  #001a33  (DEEP_NIGHT)
# =============================================================================

# --- Global format: two-line connected prompt with P10k-style rounded capsules ---
format = """
[╭─](bold #607D8B)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$git_state\
$custom_radiant_order\
$status\
$jobs\n\
[╰─](bold #607D8B)$character"""

# Right side info: weather, command duration (>2s), and compact time
right_format = """$custom_weather$cmd_duration$time"""

# Shell timeout for slow commands
command_timeout = 800

# Newline between prompts for breathing room
add_newline = true

# --- Multiline continuation prompt (Level 2 icon-led indentation) ---
continuation_prompt = "[│ ](bold #607D8B)[󰅂](bold #50fa7b) "


# =============================================================================
# PROMPT CHARACTER — Shardblade Slash ⟫ (P10k Transient Friendly)
# Success: Lifebound Emerald  |  Error: Odium Crimson  |  Vim: Lightweaver Amber
# =============================================================================
[character]
success_symbol = "[⟫](bold #50fa7b) "
error_symbol = "[⟫](bold #ed8796) "
vimcmd_symbol = "[⟪](bold #ffb86c) "

# =============================================================================
# OS ICON (Capsule badge)
# =============================================================================
[os]
disabled = false
format = "[](#1A2A3A)[$symbol](bold #00BFFF bg:#1A2A3A)[](fg:#1A2A3A) "

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"

# =============================================================================
# USERNAME & HOSTNAME (shown for SSH or root)
# =============================================================================
[username]
show_always = false
format = "[](#1A2A3A)[$user](bold #FFD700 bg:#1A2A3A)[@](bold #607D8B bg:#1A2A3A)"

[hostname]
ssh_only = true
format = "[$hostname](bold #5DA8CC bg:#1A2A3A)[](fg:#1A2A3A) "
trim_at = "."

# =============================================================================
# DIRECTORY (Windrunner Sapphire Capsule with smart icons)
# =============================================================================
[directory]
format = "[](#00BFFF)[$path]($style)[$read_only]($read_only_style)[](fg:#00BFFF) "
repo_root_format = "[](#00BFFF)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)[](fg:#00BFFF) "
style = "bold #001a33 bg:#00BFFF"
repo_root_style = "bold #001a33 bg:#00BFFF underline"
before_repo_root_style = "bold #001a33 bg:#00BFFF"
read_only = " 󰌾"
read_only_style = "bold #1A0A0A bg:#00BFFF"
truncation_length = 4
truncate_to_repo = true
home_symbol = " ~"

[directory.substitutions]
"Documents/Code/CodeForces" = " CodeForces"
"Documents/Personal/AudioBooks" = "󰋋 AudioBooks"
"Documents/Personal/Yt-Videos" = "󰗃 Yt-Videos"
"Documents/Personal/Yt-Music" = "󰝚 Yt-Music"
"Documents/Personal/Tracker" = "󱕍 Tracker"
"Documents/Personal/Books" = "󰂾 Books"
"Documents/CODING-LEARNING" = "󰑣 Learning"
"Documents/Physics-KB" = "󰆧 Physics-KB"
"Documents/Personal" = " Personal"
"Documents/Code" = " Code"
"Documents/Temp" = " Temp"
".config/sketchybar" = "󰹑 Sketchybar"
".config/spicetify" = " Spicetify"
"Applications" = " Apps"
".config/nvim" = " Nvim"
".config/yazi" = "󰇥 Yazi"
".tuxedo-todo" = "󰃤 Tuxedo"
"Documents" = "󰈙 Docs"
"Downloads" = "󰇚 Downloads"
"Pictures" = " Pics"
"Projects" = " Projects"
"Desktop" = "󰇄 Desktop"
"Library" = "🏛 Library"
".config" = " Config"
".local/share" = "󰉋 Share"
".local/bin" = " Bin"
"Movies" = "󰿎 Movies"
"Videos" = "󰕧 Videos"
"Public" = " Public"
"GitHub" = " GitHub"
".Trash" = " Trash"
"Music" = " Music"
"cpkb" = " cpkb"
".ssh" = "󰌆 ssh"
"~" = " ~"

# =============================================================================
# GIT (Shardblade Violet Capsule with P10k status badges)
# =============================================================================
[git_branch]
format = "[](#8989ff)[󰊢 $branch(:$remote_branch)](bold #001a33 bg:#8989ff)"
style = "bold #001a33 bg:#8989ff"

[git_status]
format = "([ $all_status$ahead_behind](bold #001a33 bg:#8989ff))[](fg:#8989ff) "
style = "bold #001a33 bg:#8989ff"
conflicted = "☠ Odium"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰏗"
modified = "⚡${count}"
staged = "✦${count}"
renamed = "»${count}"
deleted = "✕${count}"

[git_state]
format = "[\\($state($progress_current/$progress_total)\\)](bold #ffb86c bg:#8989ff)"
style = "bold #001a33 bg:#8989ff"

[git_metrics]
disabled = true

# =============================================================================
# RADIANT ORDER INDICATOR (Custom Capsule Badge)
# Shows the active Radiant Order bonded to the current codebase.
# =============================================================================
[custom.radiant_order]
description = "Shows the Radiant Order bonded to the current project"
when = true
format = "[](#1A2A3A)[✦ $output](bold #E040FB bg:#1A2A3A)[](fg:#1A2A3A) "
shell = ["bash", "--noprofile", "--norc"]
command = """
if ls *.py requirements.txt setup.py pyproject.toml .python-version 2>/dev/null | grep -q .; then
  echo "Lightweaver"
elif ls package.json .nvmrc *.js *.ts 2>/dev/null | grep -q .; then
  echo "Willshaper"
elif ls Cargo.toml *.rs 2>/dev/null | grep -q .; then
  echo "Stoneward"
elif ls go.mod go.sum *.go 2>/dev/null | grep -q .; then
  echo "Windrunner"
elif ls pom.xml build.gradle *.java 2>/dev/null | grep -q .; then
  echo "Skybreaker"
elif ls *.kt build.gradle.kts 2>/dev/null | grep -q .; then
  echo "Elsecaller"
elif ls *.lua 2>/dev/null | grep -q .; then
  echo "Truthwatcher"
elif ls *.c *.cpp *.h *.hpp CMakeLists.txt 2>/dev/null | grep -q .; then
  echo "Dustbringer"
fi
"""

# =============================================================================
# STATUS / ERROR (Odium Crimson Capsule on failure only)
# =============================================================================
[status]
disabled = false
format = "[](#ed8796)[✕ Odium ($int)](bold #001a33 bg:#ed8796)[](fg:#ed8796) "

# =============================================================================
# JOBS (Background jobs count)
# =============================================================================
[jobs]
format = "[](#1A2A3A)[󰒓 $number](bold #DA70D6 bg:#1A2A3A)[](fg:#1A2A3A) "
symbol = "󰒓 "
threshold = 1

# =============================================================================
# RIGHT PROMPT MODULES
# =============================================================================

# Weather module reading sketchybar cache (Zero network overhead)
[custom.weather]
command = "cat /tmp/sketchybar_weather_cache 2>/dev/null | cut -d'|' -f2,4 | sed 's/|/ /'"
when = "test -f /tmp/sketchybar_weather_cache"
format = "[](#1A2A3A)[$output](bold #5DA8CC bg:#1A2A3A)[](fg:#1A2A3A) "

# Command Execution Duration (Only shown if > 2000ms / 2s)
[cmd_duration]
format = "[](#1A2A3A)[󰔚 $duration](bold #FFD700 bg:#1A2A3A)[](fg:#1A2A3A) "
min_time = 2000
show_milliseconds = false
show_notifications = false

# Compact Time Capsule
[time]
disabled = false
format = "[](#1A2A3A)[󰅐 $time](bold #607D8B bg:#1A2A3A)[](fg:#1A2A3A)"
time_format = "%H:%M"
utc_time_offset = "local"

# =============================================================================
# DISABLED MODULES (Keep prompt lean & fast)
# =============================================================================
[c]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[kotlin]
disabled = true

[lua]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[conda]
disabled = true

[line_break]
disabled = true

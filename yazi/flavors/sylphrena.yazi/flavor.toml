# vim:fileencoding=utf-8:foldmethod=marker
# Sylphrena & Kaladin / Windrunner Honor flavor for Yazi.

# : Manager {{{

[mgr]
cwd = { fg = "#00E5FF", bold = true }

# Find
find_keyword  = { fg = "#FACC15", bold = true, italic = true, underline = true }
find_position = { fg = "#A5F3FC", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#38BDF8", bg = "#38BDF8" }
marker_cut      = { fg = "#991B1B", bg = "#991B1B" }
marker_marked   = { fg = "#00E5FF", bg = "#00E5FF" }
marker_selected = { fg = "#FACC15", bg = "#FACC15" }

# Count
count_copied   = { fg = "#090D16", bg = "#38BDF8" }
count_cut      = { fg = "#F0F8FF", bg = "#991B1B" }
count_selected = { fg = "#090D16", bg = "#FACC15" }

# Border
border_symbol = "│"
border_style  = { fg = "#1D4ED8" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#090D16", bg = "#00E5FF", bold = true }
inactive = { fg = "#94A3B8", bg = "#0F172A" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#090D16", bg = "#00E5FF", bold = true }
normal_alt  = { fg = "#00E5FF", bg = "#0F172A" }

# Select mode
select_main = { fg = "#F0F8FF", bg = "#1D4ED8", bold = true }
select_alt  = { fg = "#38BDF8", bg = "#0F172A" }

# Unset mode
unset_main = { fg = "#090D16", bg = "#FACC15", bold = true }
unset_alt  = { fg = "#FACC15", bg = "#0F172A" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#1D4ED8" }
perm_type  = { fg = "#2563EB" }
perm_read  = { fg = "#FACC15" }
perm_write = { fg = "#991B1B" }
perm_exec  = { fg = "#38BDF8" }

# Progress
progress_label  = { fg = "#F0F8FF", bold = true }
progress_normal = { fg = "#00E5FF", bg = "#1E293B" }
progress_error  = { fg = "#F0F8FF", bg = "#991B1B" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#00E5FF" }
active   = { fg = "#A5F3FC", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#00E5FF" }
title    = { fg = "#FACC15", bold = true }
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#00E5FF" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#00E5FF" }
title   = { fg = "#A5F3FC", bold = true }
hovered = { fg = "#FACC15", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#0F172A" }
cand            = { fg = "#00E5FF" }
rest            = { fg = "#94A3B8" }
desc            = { fg = "#A5F3FC" }
separator       = "  "
separator_style = { fg = "#1D4ED8" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#00E5FF", bold = true }
run     = { fg = "#A5F3FC" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#090D16", bg = "#F0F8FF" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#00E5FF" }
title    = { fg = "#00E5FF" }
tbl_col  = { fg = "#A5F3FC" }
tbl_cell = { fg = "#F0F8FF", bg = "#1E293B" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#38BDF8" }
title_warn  = { fg = "#FACC15" }
title_error = { fg = "#991B1B" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "image/*", fg = "#00E5FF" },
	# Media
	{ mime = "{audio,video}/*", fg = "#2563EB" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#2563EB" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#FACC15" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#94A3B8" },
	# Fallback
	{ url = "*", fg = "#F0F8FF" },
	{ url = "*/", fg = "#A5F3FC" },
]

# : }}}


# : Icons {{{

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#00E5FF" },
	{ name = ".git", text = "", fg = "#1D4ED8" },
	{ name = ".github", text = "", fg = "#2563EB" },
	{ name = ".npm", text = "", fg = "#991B1B" },
	{ name = "Desktop", text = "", fg = "#00E5FF" },
	{ name = "Development", text = "", fg = "#38BDF8" },
	{ name = "Documents", text = "", fg = "#FACC15" },
	{ name = "Downloads", text = "", fg = "#A5F3FC" },
	{ name = "Library", text = "", fg = "#94A3B8" },
	{ name = "Movies", text = "", fg = "#2563EB" },
	{ name = "Music", text = "", fg = "#2563EB" },
	{ name = "Pictures", text = "", fg = "#38BDF8" },
	{ name = "Public", text = "", fg = "#A5F3FC" },
	{ name = "Videos", text = "", fg = "#2563EB" },
]

conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#991B1B" },
	{ if = "link", text = "", fg = "#1D4ED8" },
	{ if = "block", text = "", fg = "#FACC15" },
	{ if = "char", text = "", fg = "#FACC15" },
	{ if = "fifo", text = "", fg = "#FACC15" },
	{ if = "sock", text = "", fg = "#2563EB" },
	{ if = "sticky", text = "", fg = "#FACC15" },
	{ if = "dummy", text = "", fg = "#991B1B" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#00E5FF" },
	{ if = "dir", text = "", fg = "#00E5FF" },
	{ if = "exec", text = "", fg = "#38BDF8" },
	{ if = "!dir", text = "", fg = "#F0F8FF" },
]

# : }}}

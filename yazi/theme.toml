	{ name = "Dockerfile",     text = "󰡨", fg = "#00A8E8" },  # Honorspren sky blue
	{ name = "*.dockerfile",   text = "󰡨", fg = "#00A8E8" },
	{ name = "docker-compose.yml",  text = "󰡨", fg = "#5DA8CC" },

	# --- Scripting & App Languages ---
	{ name = "*.py",   text = "󰌠", fg = "#5DA8CC" },  # Preservation Glacial
	{ name = "*.lua",  text = "", fg = "#00BFFF" },  # Windrunner Sapphire

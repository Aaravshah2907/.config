	{ name = ".git",           text = "󰊢", fg = "#ed8796" },
	{ name = ".gitignore",     text = "󰊢", fg = "#607D8B" },  # Stormfather slate
	{ name = ".gitattributes", text = "󰊢", fg = "#607D8B" },
	{ name = ".gitmodules",    text = "󰊢", fg = "#607D8B" },

	# --- Config Dirs / Dotfiles ---
	{ name = ".config",   text = "󰒓", fg = "#5DA8CC" },
	{ name = ".cargo",    text = "󱘗", fg = "#FF4500" },
	{ name = "node_modules", text = "", fg = "#3CB371" },
	{ name = "target",    text = "󰊢", fg = "#607D8B" },

	# --- Archives ---

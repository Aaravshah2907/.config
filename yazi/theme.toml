	{ name = "*.yml",     text = "󰈙", fg = "#FFAB40" },
	{ name = "*.xml",     text = "󰗀", fg = "#B0C4DE" },
	{ name = "*.ini",     text = "󰒓", fg = "#607D8B" },
	{ name = "*.env",     text = "󰒓", fg = "#FFD700" },  # Gloryspren gold
	{ name = ".env",      text = "󰒓", fg = "#FFD700" },
	{ name = "*.lock",    text = "󰌾", fg = "#8B6914" },  # Hemalurgic spike

	# --- Systems Languages ---
	{ name = "*.rs",   text = "󱘗", fg = "#FF4500" },  # Ashspren orange
	{ name = "*.c",    text = "", fg = "#B0C4DE" },
	{ name = "*.h",    text = "", fg = "#B0C4DE" },
	{ name = "*.cpp",  text = "", fg = "#5DA8CC" },  # Glacial blue for C++
	{ name = "*.cc",   text = "", fg = "#5DA8CC" },
	{ name = "*.hpp",  text = "", fg = "#5DA8CC" },
	{ name = "*.zig",  text = "", fg = "#FFAB40" },  # Sibling amber (Zig's brand color)

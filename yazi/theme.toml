	{ name = "*.mp4",  text = "󰈫", fg = "#E040FB" },  # Willshaper Amethyst
	{ name = "*.mkv",  text = "󰈫", fg = "#E040FB" },
	{ name = "*.webm", text = "󰈫", fg = "#E040FB" },
	{ name = "*.mp3",  text = "󰎇", fg = "#FFAB40" },  # Sibling amber
	{ name = "*.flac", text = "󰎇", fg = "#FFAB40" },
	{ name = "*.wav",  text = "󰎇", fg = "#FFAB40" },
]
[filetype]
# Cosmere-themed filetype coloring by MIME type
rules = [
	# Media
	{ mime = "image/*", fg = "#DA70D6" },          # Cryptic Orchid
	{ mime = "video/*", fg = "#E040FB" },          # Willshaper Amethyst
	{ mime = "audio/*", fg = "#FFAB40" },          # Sibling amber

	# Archives & Compressed
	{ mime = "application/zip",             fg = "#8B6914" },  # Hemalurgic spike
	{ mime = "application/x-tar",           fg = "#8B6914" },
	{ mime = "application/x-bzip2",         fg = "#8B6914" },
	{ mime = "application/x-xz",            fg = "#8B6914" },
	{ mime = "application/x-7z-compressed", fg = "#8B6914" },
	{ mime = "application/x-rar",           fg = "#8B6914" },
	{ mime = "application/zstd",            fg = "#8B6914" },
	{ mime = "application/gzip",            fg = "#8B6914" },

	# Documents
	{ mime = "application/pdf",             fg = "#FF4500" },  # Ashspren orange
	{ mime = "text/plain",                  fg = "#C8E8F5" },  # Preservation Mist
	{ mime = "text/html",                   fg = "#FFAB40" },  # Sibling amber
	{ mime = "text/css",                    fg = "#00BFFF" },  # Windrunner Sapphire
	{ mime = "text/x-shellscript",          fg = "#3CB371" },  # Cultivation green

	# Binaries & Executables
	{ mime = "application/x-executable",   fg = "#FFD700" },  # Gloryspren gold
	{ mime = "application/x-sharedlib",    fg = "#FFD700" },
	{ mime = "application/x-object",       fg = "#607D8B" },  # Stormfather slate

	# Fonts
	{ mime = "font/*",                      fg = "#C3AEE8" },  # Spren violet
	{ mime = "application/x-font-ttf",     fg = "#C3AEE8" },
	{ mime = "application/font-woff",      fg = "#C3AEE8" },
]


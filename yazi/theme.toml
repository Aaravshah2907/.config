	{ name = "*.zst",  text = "󰗄", fg = "#8B6914" },

	# --- Images ---
	{ name = "*.png",  text = "󰈟", fg = "#DA70D6" },  # Cryptic Orchid
	{ name = "*.jpg",  text = "󰈟", fg = "#DA70D6" },
	{ name = "*.jpeg", text = "󰈟", fg = "#DA70D6" },
	{ name = "*.gif",  text = "󰈟", fg = "#E040FB" },  # Willshaper Amethyst

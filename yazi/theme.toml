	# --- JavaScript / TypeScript Ecosystem ---
	{ name = "*.js",   text = "󰌞", fg = "#FFD700" },  # Gloryspren gold (JS yellow)
	{ name = "*.mjs",  text = "󰌞", fg = "#FFD700" },
